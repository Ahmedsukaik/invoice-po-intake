<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg><use href="#ledger"/></svg></span>
      <div class="brand-text">
        <h1 class="brand-name">Invoice and PO Intake</h1>
        <div class="brand-sub"><span class="hide-sm">Reference build on fictional documents.</span><span class="show-sm">Fictional documents.</span> Date fixed at 11 Oct 2026.</div>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="replay" hidden><svg class="i i-sm" aria-hidden="true"><use href="#refresh"/></svg><span>Replay the demo</span></button>
      <a class="btn btn-ghost btn-sm" href="https://github.com/Ahmedsukaik/invoice-po-intake" target="_blank" rel="noopener" aria-label="Source code on GitHub"><svg class="i i-sm" aria-hidden="true"><use href="#code"/></svg><span class="hide-sm">Source code</span></a>
    </div>
  </header>

  <section class="story" id="story" aria-labelledby="story-title" tabindex="-1">
    <div class="story-main" id="story-main"></div>
    <div class="story-actions" id="story-actions"></div>
    <div class="story-art" id="story-art" aria-hidden="true"></div>
  </section>

  <nav class="switch-row" id="switch-row" aria-label="View">
    <div class="seg seg-wide" role="group" aria-label="View">
      <button type="button" data-pane="inbox" aria-pressed="false">Inbox <span class="count" id="switch-count" hidden></span></button>
      <button type="button" data-pane="paper" aria-pressed="false">Invoice</button>
      <button type="button" data-pane="review" aria-pressed="true">Review</button>
    </div>
  </nav>

  <main class="layout" id="layout">
    <section class="inbox-pane pane" id="inbox-pane" aria-label="Inbox"></section>
    <section class="paper-pane pane" id="paper-pane" aria-label="The PDF"></section>
    <section class="review-pane pane" id="review-pane" aria-label="Review" tabindex="-1"></section>
    <section class="books-pane pane" id="books-pane" aria-label="Export and audit trail" tabindex="-1"></section>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="sr-only" id="announce" aria-live="polite"></div>
<script src="app.js"></script>
