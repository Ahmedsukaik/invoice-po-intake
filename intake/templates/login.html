{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Paste the access token your administrator gave you. It decides what you can do: clerks upload, reviewers approve or reject, administrators export.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="pairing" value="{{ pairing }}">
    <label>Access token <input type="password" name="token" autocomplete="off" required></label>
    <button class="btn primary">Sign in</button>
  </form>
</section>
{% endblock %}
